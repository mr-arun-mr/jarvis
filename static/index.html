<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<style>
  :root { --c:#2ee6ff; --c2:#0a8fa6; --bg:#02080d; --warn:#ffb347; }
  * { box-sizing: border-box; margin: 0; }
  body { background: radial-gradient(ellipse at center, #06202b 0%, var(--bg) 70%); color: var(--c);
         font-family: "SF Mono", Menlo, monospace; height: 100vh; overflow: hidden; display: grid;
         grid-template-columns: 1fr minmax(320px, 420px); }
  body::after { content:""; position:fixed; inset:0; pointer-events:none;
         background: repeating-linear-gradient(0deg, rgba(46,230,255,.03) 0 1px, transparent 1px 3px); }
  .stage { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { width: min(70vh, 90%); aspect-ratio: 1; }
  .title { position:absolute; top:24px; left:28px; letter-spacing:.4em; font-size:14px; opacity:.85; }
  .clock { position:absolute; top:24px; right:28px; font-size:14px; opacity:.7; text-align:right; }
  #state { letter-spacing:.35em; font-size:13px; margin-top:4px; text-transform:uppercase; min-height:1.2em; }
  .controls { display:flex; gap:12px; margin-top:22px; }
  button { background:transparent; color:var(--c); border:1px solid var(--c2); padding:10px 18px;
           font:inherit; letter-spacing:.2em; cursor:pointer; text-transform:uppercase; transition:.2s; }
  button:hover, button.on { background:rgba(46,230,255,.15); box-shadow:0 0 18px rgba(46,230,255,.4); }
  button.on { border-color:var(--c); }
  select { background:#02080d; color:var(--c); border:1px solid var(--c2); padding:10px 12px; font:inherit; }
  .msg.alert { border-color:#7dff9b; color:#7dff9b; }
  .panel { border-left:1px solid var(--c2); display:flex; flex-direction:column; background:rgba(2,12,18,.7); min-height:0; }
  .panel h2 { font-size:12px; letter-spacing:.35em; padding:22px 22px 12px; opacity:.7; font-weight:400; }
  #log { flex:1; overflow-y:auto; padding:0 22px; display:flex; flex-direction:column; gap:14px; }
  .msg { font-size:13px; line-height:1.5; padding-left:12px; border-left:2px solid var(--c2); white-space:pre-wrap; }
  .msg.user { border-color:var(--warn); color:var(--warn); }
  .msg small { display:block; opacity:.5; font-size:10px; letter-spacing:.25em; margin-bottom:2px; }
  form { display:flex; border-top:1px solid var(--c2); }
  input { flex:1; background:transparent; border:0; color:var(--c); font:inherit; padding:18px 22px; outline:none; }
  input::placeholder { color:var(--c2); }
  #note { font-size:11px; padding:0 22px 10px; color:var(--warn); min-height:1.4em; }
  @media (max-width: 800px) { body { grid-template-columns:1fr; grid-template-rows:55vh 1fr; } }
</style>
</head>
<body>
<div class="stage">
  <div class="title">J.A.R.V.I.S.</div>
  <div class="clock" id="clock"></div>
  <canvas id="orb" width="900" height="900"></canvas>
  <div id="state">standing by</div>
  <div class="controls">
    <button id="mic">Listen</button>
    <button id="mute">Voice: on</button>
    <select id="lang" title="Language">
      <option value="en-GB">English</option>
      <option value="ml-IN">മലയാളം</option>
      <option value="ta-IN">தமிழ்</option>
    </select>
  </div>
</div>
<div class="panel">
  <h2>TRANSCRIPT</h2>
  <div id="log"></div>
  <div id="note"></div>
  <form id="form"><input id="input" placeholder="Type a command…" autocomplete="off"></form>
</div>

<script>
const $ = id => document.getElementById(id);
const log = $("log"), stateEl = $("state"), note = $("note");
let state = "idle", history = [], voiceOn = true, listening = false, level = 0;

function setState(s) {
  state = s;
  stateEl.textContent = { idle:"standing by", listening:"listening", thinking:"processing", speaking:"speaking" }[s];
}
setInterval(() => {
  const d = new Date();
  $("clock").innerHTML = d.toLocaleTimeString() + "<br>" + d.toLocaleDateString(undefined,
    { weekday:"short", month:"short", day:"numeric" }).toUpperCase();
}, 500);

// ---------- Orb ----------
const cv = $("orb"), g = cv.getContext("2d");
const W = cv.width, C = W / 2;
let t = 0;
function ring(r, w, dash, rot, alpha) {
  g.save(); g.translate(C, C); g.rotate(rot);
  g.strokeStyle = `rgba(46,230,255,${alpha})`; g.lineWidth = w; g.setLineDash(dash);
  g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.stroke(); g.restore();
}
function draw() {
  t += 0.016;
  const speed = { idle:.3, listening:.8, thinking:2.2, speaking:1.1 }[state];
  const pulse = state === "speaking" ? (Math.sin(t * 9) + Math.sin(t * 13.7)) * .5 : Math.sin(t * 2);
  const amp = state === "listening" ? level : state === "speaking" ? .5 + pulse * .5 : .2 + pulse * .1;
  g.clearRect(0, 0, W, W);
  const glow = g.createRadialGradient(C, C, 20, C, C, 380);
  glow.addColorStop(0, `rgba(46,230,255,${.25 + amp * .35})`);
  glow.addColorStop(1, "rgba(46,230,255,0)");
  g.fillStyle = glow; g.fillRect(0, 0, W, W);
  ring(400, 2, [4, 14], t * speed * .5, .5);
  ring(360, 6, [90, 30, 20, 30], -t * speed * .8, .75);
  ring(310, 2, [], 0, .35);
  ring(270, 10, [40, 20], t * speed * 1.3, .8);
  ring(220 + amp * 14, 3, [2, 8], -t * speed * 2, .9);
  // reactor core + spokes
  g.save(); g.translate(C, C); g.rotate(t * speed);
  for (let i = 0; i < 12; i++) {
    g.rotate(Math.PI / 6);
    g.fillStyle = `rgba(46,230,255,${.5 + amp * .5})`;
    g.fillRect(100, -6, 60 + amp * 40, 12);
  }
  g.restore();
  const core = g.createRadialGradient(C, C, 0, C, C, 90 + amp * 25);
  core.addColorStop(0, "#fff"); core.addColorStop(.35, "#8ff3ff"); core.addColorStop(1, "rgba(46,230,255,0)");
  g.fillStyle = core; g.beginPath(); g.arc(C, C, 90 + amp * 25, 0, Math.PI * 2); g.fill();
  requestAnimationFrame(draw);
}
draw();

// ---------- Chat ----------
function addMsg(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.innerHTML = `<small>${role === "user" ? "YOU" : "JARVIS"}</small><span></span>`;
  d.lastChild.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d.lastChild;
}

async function ask(text) {
  text = text.trim(); if (!text) return;
  addMsg("user", text);
  history.push({ role: "user", content: text });
  setState("thinking");
  const out = addMsg("jarvis", "");
  let full = "";
  try {
    const res = await fetch("/chat", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ messages: history, lang: $("lang").value }) });
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 1);
        if (!line) continue;
        const j = JSON.parse(line);
        if (j.error) throw new Error(j.error);
        full += j.t; out.textContent = full; log.scrollTop = log.scrollHeight;
      }
    }
  } catch (e) {
    out.textContent = "Connection fault: " + e.message; setState("idle"); return;
  }
  history.push({ role: "assistant", content: full });
  speak(full);
}

function speak(text) {
  if (!voiceOn || !window.speechSynthesis) { setState("idle"); resumeListening(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const voices = speechSynthesis.getVoices(), lang = $("lang").value;
  if (lang !== "en-GB") {
    u.lang = lang;
    u.voice = voices.find(v => v.lang.replace("_", "-") === lang) || null;
    if (!u.voice) { note.textContent = "No " + lang + " voice installed on this device, so replies are shown, not spoken."; setState("idle"); resumeListening(); return; }
    note.textContent = "";
  } else {
    u.voice = voices.find(v => /Daniel|Google UK English Male/.test(v.name)) || voices.find(v => v.lang === "en-GB") || null;
  }
  u.rate = 1.02; u.pitch = .9;
  u.onstart = () => setState("speaking");
  u.onend = u.onerror = () => { setState("idle"); resumeListening(); };
  speechSynthesis.speak(u);
}

$("lang").onchange = () => { if (wantListen) { wantListenPause(); } try { localStorage.setItem("jarvisLang", $("lang").value); } catch {} };
try { const l = localStorage.getItem("jarvisLang"); if (l) $("lang").value = l; } catch {}

// Alerts, timers and briefings pushed by the server's scheduler
let lastEvent = 0;
async function pollEvents() {
  try {
    const res = await fetch("/events?since=" + lastEvent);
    if (res.ok) for (const e of await res.json()) {
      lastEvent = Math.max(lastEvent, e.id);
      const d = document.createElement("div");
      d.className = "msg alert";
      d.innerHTML = `<small>ALERT ${e.time} · </small><span></span>`;
      d.firstChild.append(e.title.toUpperCase());
      d.lastChild.textContent = e.body;
      log.appendChild(d); log.scrollTop = log.scrollHeight;
    }
  } catch {}
}
setInterval(pollEvents, 5000); pollEvents();

$("form").onsubmit = e => { e.preventDefault(); const v = $("input").value; $("input").value = ""; ask(v); };
$("mute").onclick = () => {
  voiceOn = !voiceOn; $("mute").textContent = "Voice: " + (voiceOn ? "on" : "off");
  if (!voiceOn) speechSynthesis.cancel();
};

// ---------- Speech recognition ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec, wantListen = false, audioCtx, analyser, stream;
function resumeListening() { if (wantListen) startRec(); }

async function startMeter() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new AudioContext(); analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    const buf = new Uint8Array(analyser.frequencyBinCount);
    (function tick() {
      if (!analyser) return;
      analyser.getByteFrequencyData(buf);
      level = Math.min(1, buf.reduce((a, b) => a + b, 0) / buf.length / 70);
      requestAnimationFrame(tick);
    })();
  } catch { /* meter is cosmetic */ }
}
function stopMeter() {
  analyser = null; level = 0;
  stream && stream.getTracks().forEach(t => t.stop());
  audioCtx && audioCtx.close();
}

function startRec() {
  if (!SR) { note.textContent = "Voice input needs Chrome or Safari. Typing still works."; return; }
  rec = new SR(); rec.lang = $("lang").value; rec.interimResults = true; rec.continuous = false;
  rec.onstart = () => { listening = true; setState("listening"); };
  rec.onresult = e => {
    const r = e.results[e.results.length - 1];
    $("input").value = r[0].transcript;
    if (r.isFinal) { $("input").value = ""; wantListenPause(); ask(r[0].transcript); }
  };
  rec.onerror = e => {
    if (e.error === "not-allowed") { note.textContent = "Microphone blocked. Allow it in the browser address bar."; stopListen(); }
  };
  rec.onend = () => { listening = false; if (wantListen && state === "listening") startRec(); };
  rec.start();
}
function wantListenPause() { try { rec.stop(); } catch {} }
function stopListen() {
  wantListen = false; $("mic").classList.remove("on"); $("mic").textContent = "Listen";
  wantListenPause(); stopMeter(); if (state === "listening") setState("idle");
}
$("mic").onclick = () => {
  if (wantListen) return stopListen();
  wantListen = true; $("mic").classList.add("on"); $("mic").textContent = "Listening…";
  note.textContent = ""; speechSynthesis && speechSynthesis.cancel(); startMeter(); startRec();
};

addMsg("jarvis", "Good day. All systems are online. How can I help?");
</script>
</body>
</html>
